name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build DMG and publish GitHub release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not a valid version (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "NANOPANDA_VERSION=$version" >> "$GITHUB_ENV"
          echo "NANOPANDA_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run Swift tests
        run: swift test

      - name: Build universal app bundle
        run: ./scripts/bundle-app.sh --arch arm64 --arch x86_64

      - name: Create DMG
        run: ./scripts/make-dmg.sh

      - name: Write checksum
        working-directory: dist
        run: shasum -a 256 "NanoPanda-${NANOPANDA_VERSION}.dmg" > "NanoPanda-${NANOPANDA_VERSION}.dmg.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=("dist/NanoPanda-${NANOPANDA_VERSION}.dmg" "dist/NanoPanda-${NANOPANDA_VERSION}.dmg.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prerelease=()
            if [[ "$NANOPANDA_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Nano Panda $NANOPANDA_VERSION" \
              --generate-notes \
              "${prerelease[@]}"
          fi
